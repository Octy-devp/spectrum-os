[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-os"
version = "0.1.0"
description = "β₁ worldline NSPV economic deviation detection machine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["spectrum_os*"]

[project.scripts]
tio-sh = "spectrum_os.cli:main"
