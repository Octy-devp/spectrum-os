[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-os"
version = "2.7.0"
description = "Dual-worldline spectrum analysis engine — 6D state vector, quantum layer, LLM synthesis gate"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6.0",
]
test = [
    "pytest>=8,<9",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["spectrum_os*"]

[project.scripts]
tio-sh = "spectrum_os.cli:main"
